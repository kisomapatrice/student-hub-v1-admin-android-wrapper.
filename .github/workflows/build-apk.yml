name: Build Student Hub Admin V1 Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: student-hub-v1-admin-android-build
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify installable APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Diagnose and unpack Android source bundle
        shell: bash
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Commit: $GITHUB_SHA"
          echo "Files present at repository root:"
          find . -maxdepth 2 -type f ! -path './.git/*' -print | sort

          SOURCE_ZIP="student-hub-v1-admin-android-source-2.0.0.zip"
          if [ ! -f "$SOURCE_ZIP" ]; then
            echo "::error::Required source bundle is missing: $SOURCE_ZIP"
            echo "ZIP files actually present in the repository:"
            find . -type f -iname '*.zip' -print | sort || true
            echo "Upload the source bundle to the repository root, keeping its exact filename."
            exit 1
          fi

          if ! unzip -tq "$SOURCE_ZIP"; then
            echo "::error::The source bundle is present but failed ZIP integrity validation."
            exit 1
          fi

          EXTRACT_DIR="$RUNNER_TEMP/student-hub-v1-admin-source"
          BUILD_DIR="$GITHUB_WORKSPACE/build-src"
          rm -rf "$EXTRACT_DIR" "$BUILD_DIR"
          mkdir -p "$EXTRACT_DIR" "$BUILD_DIR"
          if ! unzip -q "$SOURCE_ZIP" -d "$EXTRACT_DIR"; then
            echo "::error::Could not extract the source bundle."
            exit 1
          fi

          SETTINGS_FILE="$(find "$EXTRACT_DIR" -type f -name settings.gradle -print -quit)"
          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::No settings.gradle was found inside the source bundle."
            echo "Extracted file listing for diagnosis:"
            find "$EXTRACT_DIR" -maxdepth 6 -type f -print | sort || true
            exit 1
          fi
          PROJECT_ROOT="$(dirname "$SETTINGS_FILE")"

          required_files=(
            "settings.gradle"
            "build.gradle"
            "gradle.properties"
            "app/build.gradle"
            "app/src/main/AndroidManifest.xml"
            "app/src/main/java/ug/studenthub/adminapp/MainActivity.java"
            "app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml"
            "app/src/main/res/drawable/ic_launcher_foreground.xml"
            "app/src/main/res/mipmap-xxxhdpi/ic_launcher.png"
          )
          missing=0
          for relative_path in "${required_files[@]}"; do
            if [ ! -f "$PROJECT_ROOT/$relative_path" ]; then
              echo "::error::Required project file missing from source bundle: $relative_path"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Project root detected as: $PROJECT_ROOT"
            find "$PROJECT_ROOT" -maxdepth 7 -type f -print | sort || true
            exit 1
          fi

          cp -a "$PROJECT_ROOT"/. "$BUILD_DIR"/
          echo "Source bundle validated and copied."
          echo "Detected project root: $PROJECT_ROOT"
          echo "Build directory: $BUILD_DIR"
          echo "Core files in build directory:"
          find "$BUILD_DIR" -maxdepth 4 -type f -print | sort

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
          echo "Installed Android platform and build tools:"
          sdkmanager --list_installed | grep -E 'platforms;android-36|build-tools;36.0.0' || true

      - name: Restore stable private-test signing identity
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: student-hub-v1-admin-debug-signing-identity-v1

      - name: Prepare signing identity if this is the first build
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -s "$HOME/.android/debug.keystore" ]; then
            echo "No cached test signing key found; creating the first private-test key."
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          else
            echo "Reusing the cached private-test signing key."
          fi
          ls -lh "$HOME/.android/debug.keystore"

      - name: Set up compatible Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build APK
        shell: bash
        run: |
          echo "Java runtime:"
          java -version
          echo "Gradle runtime:"
          gradle --version
          echo "Starting clean Android build..."
          gradle --no-daemon --stacktrace -p build-src clean :app:assembleDebug

      - name: Verify APK integrity, signature, package, and size
        shell: bash
        run: |
          set -o pipefail
          GENERATED_APK="build-src/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -s "$GENERATED_APK" ]; then
            echo "::error::Gradle completed without producing a non-empty APK at $GENERATED_APK"
            echo "Any APK files produced:"
            find build-src/app/build/outputs -type f -name '*.apk' -print 2>/dev/null || true
            exit 1
          fi

          SIZE_BYTES="$(wc -c < "$GENERATED_APK" | tr -d ' ')"
          echo "Generated APK size: $SIZE_BYTES bytes"
          ls -lh "$GENERATED_APK"
          if [ "$SIZE_BYTES" -lt 50000 ]; then
            echo "::error::APK is unexpectedly small (under 50,000 bytes). Refusing to publish a possible incomplete artifact."
            exit 1
          fi

          if ! unzip -tq "$GENERATED_APK"; then
            echo "::error::APK ZIP integrity test failed."
            exit 1
          fi
          echo "APK ZIP integrity: PASS"

          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          if [ ! -x "$APKSIGNER" ] || [ ! -x "$AAPT" ]; then
            echo "::error::Expected Android verification tools were not found under $ANDROID_HOME/build-tools/36.0.0"
            ls -la "$ANDROID_HOME/build-tools/36.0.0" || true
            exit 1
          fi
          "$APKSIGNER" verify --verbose "$GENERATED_APK"
          echo "APK signature: PASS"

          BADGING="$("$AAPT" dump badging "$GENERATED_APK")"
          printf '%s\n' "$BADGING" | grep -F "package: name='ug.studenthub.adminv1.app200' versionCode='200' versionName='2.0.0'" >/dev/null
          echo "Package and version: PASS"
          printf '%s\n' "$BADGING" | grep -E "^(package:|application-label:)" || true

          mkdir -p release
          cp "$GENERATED_APK" release/Student-Hub-Admin-V1-2.0.0-debug.apk
          (cd release && sha256sum Student-Hub-Admin-V1-2.0.0-debug.apk > Student-Hub-Admin-V1-2.0.0-debug.apk.sha256)
          echo "Final release file:"
          ls -lh release/Student-Hub-Admin-V1-2.0.0-debug.apk release/Student-Hub-Admin-V1-2.0.0-debug.apk.sha256
          echo "SHA-256:"
          cat release/Student-Hub-Admin-V1-2.0.0-debug.apk.sha256

          {
            echo "## Student Hub Admin V1 — APK verification"
            echo "- Build: PASS"
            echo "- APK ZIP integrity: PASS"
            echo "- APK signature: PASS"
            echo "- Package: ug.studenthub.adminv1.app200"
            echo "- Version: 2.0.0 (code 200)"
            echo "- File size: $SIZE_BYTES bytes"
            echo "- SHA-256: $(sha256sum release/Student-Hub-Admin-V1-2.0.0-debug.apk | cut -d ' ' -f 1)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save stable private-test signing identity
        uses: actions/cache/save@v4
        with:
          path: ~/.android/debug.keystore
          key: student-hub-v1-admin-debug-signing-identity-v1

      - name: Upload verified APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Student-Hub-Admin-V1-2.0.0-verified-APK
          path: |
            release/Student-Hub-Admin-V1-2.0.0-debug.apk
            release/Student-Hub-Admin-V1-2.0.0-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
